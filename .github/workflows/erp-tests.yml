name: SHIPMENTS ERP Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r SHIPMENTS_ERP_V3_3/requirements.txt
          pip install pytest

      - name: Python syntax check
        run: |
          python -m py_compile SHIPMENTS_ERP_V3_3/backend/main.py

      - name: API tests
        run: |
          python -m pytest -q SHIPMENTS_ERP_V3_3/tests/test_api.py

      - name: JavaScript tests
        run: |
          cd SHIPMENTS_ERP_V3_3
          node --test tests/*.test.cjs
